# docker-compose.gce.yml
# Run on a GCE VM to provide Redis + PostgreSQL + Scraper Service for Cloud Run.
# Cloud Run connects via VPC connector to the VM's internal IP.
#
# Usage:
#   ssh into GCE VM, then:
#   docker compose -f docker-compose.gce.yml up -d

services:
  redis:
    image: "redis:7-alpine"
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  postgres:
    image: "postgres:16-alpine"
    container_name: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-betting_analysis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  scraper:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    container_name: scraper-service
    ports:
      - "9001:9001"
    restart: unless-stopped
    init: true          # tini as PID 1 — reaps zombie Chrome processes
    shm_size: 256m      # Chrome needs more than the default 64MB /dev/shm
    environment:
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-changeme}
      # Force UTC so Chrome renders FlashScore match times in UTC
      # regardless of the GCE VM's host timezone. See scraper-service
      # flashscore_scraper.py for the in-process CDP override.
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  # Grafana Alloy — ships Cloud Run logs (via Pub/Sub) + these local
  # container logs to Grafana Cloud Loki. See observability/README.md.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./observability/gcp-sa-key.json:/etc/alloy/gcp-sa-key.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      # Grafana Cloud Loki push credentials
      - GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL}
      - GRAFANA_LOKI_USER=${GRAFANA_LOKI_USER}
      - GRAFANA_LOKI_TOKEN=${GRAFANA_LOKI_TOKEN}
      # GCP Pub/Sub source (Cloud Run logs)
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOG_SUBSCRIPTION=${GCP_LOG_SUBSCRIPTION}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/alloy/gcp-sa-key.json

volumes:
  redis-data:
  postgres-data:
  alloy-data:
